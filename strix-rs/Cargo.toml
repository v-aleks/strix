[workspace]
resolver = "2"
members = [
    "crates/strix-config",
    "crates/strix-llm",
    "crates/strix-agent",
    "crates/strix-tools",
    "crates/strix-runtime",
    "crates/strix-report",
    "crates/strix-tui",
    "crates/strix-cli",
    "crates/strix-mock-llm",
    "crates/strix-contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/usestrix/strix"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The port targets a single local provider; unwrap/expect are not acceptable in
# library code paths that a malformed model response can reach.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
uninlined_format_args = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
struct_field_names = "allow"
# Tool schemas are generated from Python-side descriptions; long literals are
# part of the data, not a style problem.
too_many_lines = "allow"

[workspace.dependencies]
strix-config = { path = "crates/strix-config" }
strix-llm = { path = "crates/strix-llm" }
strix-agent = { path = "crates/strix-agent" }
strix-tools = { path = "crates/strix-tools" }
strix-runtime = { path = "crates/strix-runtime" }
strix-report = { path = "crates/strix-report" }
strix-tui = { path = "crates/strix-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
bollard = "0.18"
serde_yaml = "0.9"
minijinja = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
