name: Rust CI

on:
  pull_request:
    paths:
      - 'strix-rs/**'
      - 'scripts/export_golden_fixtures.py'
      - '.github/workflows/rust.yml'
  push:
    branches:
      - main
    paths:
      - 'strix-rs/**'
      - 'scripts/export_golden_fixtures.py'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache the cargo registry and the build artifacts
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            strix-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('strix-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: strix-rs
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: strix-rs
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        working-directory: strix-rs
        run: cargo build --workspace --all-targets

      - name: Test against the mock llama.cpp server
        working-directory: strix-rs
        run: cargo test --workspace

  golden-fixtures:
    name: golden fixtures are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env

      - name: Regenerate the golden fixtures from the Python implementation
        run: uv run --frozen python scripts/export_golden_fixtures.py

      - name: The committed fixtures match the Python implementation
        run: |
          git diff --exit-code --stat -- \
            strix-rs/crates/strix-contracts/tests/fixtures/golden
          test -z "$(git status --porcelain -- strix-rs/crates/strix-contracts/tests/fixtures/golden)"
